[package]
name = "rewind-engine"
description = "Application layer of Rewind: use cases, the ports they need, in-memory adapters, and the conformance suites of the ports."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
# Every file of tests/ is a module of one test binary, tests/integration.rs.
autotests = false

[features]
# The conformance suites every adapter of `CatalogStore`, `PartitionStore`, `RunArchive`,
# `Cluster`, `AccessStore`, `BlobStore`, `SecretStore`, `SpanExporter` and `WebhookSender` must
# pass.
conformance = []

[dependencies]
rewind-core.workspace = true
# The Ed25519 signing keys the memory `SecretStore` makes, and the conformance suite checks: the
# crypto the HTTP clients already build (rustls on aws-lc-rs).
aws-lc-rs.workspace = true
# The base64 form of an HTTP basic secret, taken out of the answers that echo it.
base64.workspace = true
# Quota alerts are sent to every subscription at once (`join_all`); the changes of the control
# plane are a `Stream`.
futures-util = { workspace = true, features = ["alloc"] }
getrandom.workspace = true
jiff.workspace = true
jsonschema.workspace = true
regex.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# The actors of a node run in tokio tasks in a process; the timer wheel sleeps until its earliest
# timer; the SDK streams and the subscriptions are channels.
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tracing.workspace = true
uuid = { workspace = true, features = ["std", "v7"] }

[dev-dependencies]
rewind-engine = { path = ".", features = ["conformance"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "sync"] }

[[test]]
name = "integration"
path = "tests/integration.rs"

[lints]
workspace = true
