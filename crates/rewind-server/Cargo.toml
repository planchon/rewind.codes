[package]
name = "rewind-server"
description = "A node of Rewind and its HTTP edge: the API /v1, the owners of its partitions, its executors, the node link, the embedded server, the dashboard."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
build = "build.rs"
# Every file of tests/ is a module of one test binary, tests/integration.rs.
autotests = false

# A composition root: the only kind of crate, with rewind-cli, that knows every adapter
# (archi/07-code-architecture.md, "Dependency rules"). Each adapter is wired in its own module of
# `src/wiring/`.
[dependencies]
rewind-agent-tools.workspace = true
rewind-api.workspace = true
rewind-blob.workspace = true
rewind-check.workspace = true
rewind-codegen.workspace = true
rewind-core.workspace = true
rewind-engine.workspace = true
rewind-format.workspace = true
rewind-mcp.workspace = true
rewind-mcp-server.workspace = true
rewind-openapi.workspace = true
rewind-outbound.workspace = true
rewind-otel.workspace = true
rewind-runtime.workspace = true
rewind-store-postgres.workspace = true
# The node link writes the partition records the stored format defines, through the store's
# conversions (`rewind_store_slatedb::codec`).
rewind-store-slatedb.workspace = true
rewind-store-turso.workspace = true
rewind-workos.workspace = true
# HTTP/2 without TLS (prior knowledge): the node link's listener.
axum = { workspace = true, features = ["http2"] }
base64.workspace = true
clap = { workspace = true }
fs4 = { workspace = true }
futures-util = { workspace = true, features = ["alloc"] }
getrandom.workspace = true
jiff.workspace = true
jsonwebtoken.workspace = true
reqwest.workspace = true
# The embedded server's `ready`: standard output sent where standard error goes once it is
# written, without unsafe code.
rustix = { workspace = true, features = ["stdio"] }
serde.workspace = true
serde_html_form.workspace = true
serde_json.workspace = true
sha2.workspace = true
# The subscriptions of the node link, read as server-sent events.
sse-stream.workspace = true
# The cluster secret, compared in constant time.
subtle = "2.6"
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing.workspace = true
uuid = { workspace = true, features = ["std", "v7"] }

[dev-dependencies]
aws-lc-rs.workspace = true
rewind-engine = { workspace = true, features = ["conformance"] }
rmcp = { workspace = true, features = ["server", "transport-streamable-http-server"] }
tempfile.workspace = true
# The logs of the process, captured by the end-to-end tests of secrets to look for a value.
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "registry"] }

[[test]]
name = "integration"
path = "tests/integration.rs"

[lints]
workspace = true
