[package]
name = "ptc-engine"
description = "Application layer of ai-ptc: use cases, the ports they need, in-memory adapters, and the store conformance suite."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# The conformance suite every `JournalStore` adapter must pass.
conformance = []

[dependencies]
ptc-core.workspace = true
getrandom.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid = { workspace = true, features = ["std", "v7"] }

[dev-dependencies]
ptc-engine = { path = ".", features = ["conformance"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "macros"] }

[lints]
workspace = true
