[package]
name = "rewind-store-postgres"
description = "Production control plane of Rewind on Postgres: CatalogStore, Cluster, AccessStore and SecretStore."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
rewind-core.workspace = true
rewind-engine.workspace = true
rewind-format.workspace = true
aws-lc-rs.workspace = true
chacha20poly1305 = "0.11"
futures-util = { workspace = true, features = ["alloc"] }
getrandom.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
# The holder of a node's lock, its watches and its listeners (`crate::cluster`).
tokio = { workspace = true, features = ["rt", "sync", "macros"] }
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
futures-util = { workspace = true, features = ["alloc"] }
rewind-engine = { workspace = true, features = ["conformance"] }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }

[lints]
workspace = true
