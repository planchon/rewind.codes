[package]
name = "rewind-store-slatedb"
description = "PartitionStore of Rewind on SlateDB over object storage: AWS S3 or any S3-compatible service, local files, memory."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
# Every file of tests/ is a module of one test binary, tests/integration.rs.
autotests = false

[dependencies]
rewind-core.workspace = true
rewind-engine.workspace = true
rewind-format.workspace = true
# The local-file backend of the embedded partition, beside the workspace's S3 one.
object_store = { workspace = true, features = ["fs"] }
# The records `rename-data` reads under the names they were written with.
serde_json.workspace = true
slatedb.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "rt"] }
tracing.workspace = true

[dev-dependencies]
rewind-engine = { workspace = true, features = ["conformance"] }
# The benchmark's object store that counts its requests: object_store's trait is an async_trait.
async-trait = "0.1"
futures-util = { workspace = true, features = ["alloc"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }

[[test]]
name = "integration"
path = "tests/integration.rs"

[lints]
workspace = true
