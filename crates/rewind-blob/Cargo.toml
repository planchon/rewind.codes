[package]
name = "rewind-blob"
description = "BlobStore adapters of Rewind: local files, S3, and the workers' local cache."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
rewind-core.workspace = true
rewind-engine.workspace = true
# The objects of a run's prefix, listed as a stream to delete them (`object_store`'s own).
futures-util = { workspace = true, features = ["alloc"] }
object_store.workspace = true
quick_cache.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt"] }

[dev-dependencies]
rewind-engine = { workspace = true, features = ["conformance"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros"] }

[lints]
workspace = true
