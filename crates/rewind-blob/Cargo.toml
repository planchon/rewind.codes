[package]
name = "rewind-blob"
description = "BlobStore and RunArchive adapters of Rewind: local files, S3, and the local caches in front of them."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
# Every file of tests/ is a module of one test binary, tests/integration.rs.
autotests = false

[dependencies]
rewind-core.workspace = true
rewind-engine.workspace = true
# The run export of a sealed attempt (`crate::archive`).
rewind-format.workspace = true
# The objects of a run's prefix, listed as a stream to delete them (`object_store`'s own).
futures-util = { workspace = true, features = ["alloc"] }
object_store.workspace = true
quick_cache.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt"] }

[dev-dependencies]
rewind-engine = { workspace = true, features = ["conformance"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros"] }

[[test]]
name = "integration"
path = "tests/integration.rs"

[lints]
workspace = true
