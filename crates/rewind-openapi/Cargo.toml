[package]
name = "rewind-openapi"
description = "API tools of Rewind: OpenAPI 3.0 and 3.1 documents read into pinned tools, and the ToolDispatcher of the api route."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
# Every file of tests/ is a module of one test binary, tests/integration.rs.
autotests = false

# An adapter: it depends on rewind-core and rewind-engine, and, as a tool dispatcher, on
# rewind-outbound (archi/07-code-architecture.md, "Dependency rules").
[dependencies]
rewind-core.workspace = true
rewind-engine.workspace = true
rewind-outbound.workspace = true
base64.workspace = true
# Retry-After as an HTTP date.
httpdate.workspace = true
percent-encoding.workspace = true
reqwest.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }
tracing.workspace = true
url.workspace = true

[dev-dependencies]
axum.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time"] }

[[test]]
name = "integration"
path = "tests/integration.rs"

[lints]
workspace = true
