[package]
name = "ptc-e2e"
description = "End-to-end corpus of ai-ptc: recorded scenarios, replayed in CI, per determinism epoch."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
build = "build.rs"

[dependencies]
ptc-core.workspace = true
ptc-engine.workspace = true
ptc-format.workspace = true
ptc-mcp.workspace = true
ptc-runtime.workspace = true
jsonschema.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "macros"] }

[dev-dependencies]
ptc-check.workspace = true
ptc-codegen.workspace = true

[[bin]]
name = "ptc-e2e"
path = "src/bin/ptc-e2e.rs"
test = false

[lints]
workspace = true
