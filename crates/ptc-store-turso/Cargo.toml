[package]
name = "ptc-store-turso"
description = "Embedded store of ai-ptc on Turso Database: JournalStore, ReadModel and SecretStore."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
ptc-core.workspace = true
ptc-engine.workspace = true
ptc-format.workspace = true
chacha20poly1305 = "0.11"
getrandom.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true
# Turso Database is in beta: pinned to an exact version, upgraded on purpose.
turso = { version = "=0.8.3", default-features = false }

[dev-dependencies]
ptc-engine = { workspace = true, features = ["conformance"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "sync"] }

[lints]
workspace = true
