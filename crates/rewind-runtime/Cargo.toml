[package]
name = "rewind-runtime"
description = "V8 adapter of Rewind: the deterministic sandbox behind the engine's ScriptExecutor port."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
# Every file of tests/ is a module of one test binary, tests/integration.rs.
autotests = false

[dependencies]
rewind-core.workspace = true
rewind-engine.workspace = true
chacha20.workspace = true
deno_ast.workspace = true
deno_core.workspace = true
deno_error.workspace = true
deno_web.workspace = true
deno_webidl.workspace = true
jsonschema.workspace = true
rustix = { workspace = true, features = ["time"] }
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }

[[test]]
name = "integration"
path = "tests/integration.rs"

[lints]
workspace = true
