[package]
name = "rewind-mcp"
description = "Tool dispatcher of Rewind outside test runs: the MCP client (discovery, dispatch, the attached secret or the signature in the transport) and the built-in http tool with its allow-list."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# An adapter: it depends on rewind-core and rewind-engine, and, as a tool dispatcher, on
# rewind-outbound (archi/07-code-architecture.md, "Dependency rules").
[dependencies]
rewind-core.workspace = true
rewind-engine.workspace = true
rewind-outbound.workspace = true
base64.workspace = true
# The stream type rmcp's HTTP client trait names, which the signing client implements.
futures-util = { workspace = true, features = ["alloc"] }
# The random key of the pool's fingerprints.
getrandom.workspace = true
hmac.workspace = true
jsonschema.workspace = true
reqwest.workspace = true
rmcp = { workspace = true, features = [
    "client",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
    "reqwest",
] }
serde_json.workspace = true
sha2.workspace = true
# The version rmcp's HTTP client trait names (`Sse`), not the workspace's.
sse-stream = "0.2"
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "process", "net", "io-util", "macros"] }
tracing.workspace = true
url.workspace = true

[dev-dependencies]
axum.workspace = true
futures-util = { workspace = true, features = ["std"] }
libtest-mimic.workspace = true
rmcp = { workspace = true, features = [
    "client",
    "server",
    "transport-io",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
    "transport-streamable-http-server",
    "reqwest",
] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-std"] }
tokio-util.workspace = true

# Integration tests against MCP servers started by the tests. A custom harness, so that the
# test binary can also run as the stdio server the tests start (`REWIND_MCP_FIXTURE=stdio`).
[[test]]
name = "mcp"
harness = false

[lints]
workspace = true
