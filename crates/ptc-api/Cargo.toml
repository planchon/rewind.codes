[package]
name = "ptc-api"
description = "The HTTP API /v1 of ai-ptc as a contract: DTOs, problem+json errors, webhook signatures, the OpenAPI document and a thin async client."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Adapter support: among internal crates, ptc-api depends only on ptc-core
# (archi/07-code-architecture.md, "Dependency rules"). No server code lives here.
[dependencies]
ptc-core.workspace = true
base64.workspace = true
futures-util.workspace = true
hmac.workspace = true
jiff.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sse-stream.workspace = true
thiserror.workspace = true
utoipa.workspace = true
winnow.workspace = true

[dev-dependencies]
axum.workspace = true
serde_html_form.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread"] }

[lints]
workspace = true
