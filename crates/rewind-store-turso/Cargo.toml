[package]
name = "rewind-store-turso"
description = "Embedded control plane of Rewind on Turso Database: CatalogStore, a Cluster of one process, AccessStore and SecretStore."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
rewind-core.workspace = true
rewind-engine.workspace = true
rewind-format.workspace = true
aws-lc-rs.workspace = true
chacha20poly1305 = "0.11"
getrandom.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true
# Turso Database is in beta: pinned to an exact version, upgraded on purpose.
turso = { version = "=0.8.3", default-features = false }

[dev-dependencies]
futures-util.workspace = true
rewind-engine = { workspace = true, features = ["conformance"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "sync"] }

[lints]
workspace = true
