# CI of ai-ptc: the Rust workspace (formatting, lints, every test with the Docker services the
# tests start: Postgres, MinIO, the OpenTelemetry Collector; the e2e corpus; the OpenAPI
# document), the SDK and the dashboard, the image, and the reference deployment under load.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Backtraces keep their lines; the target directory stays small enough for the runner.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  RUST_BACKTRACE: 1
  PNPM_VERSION: 10.15.0
  NODE_VERSION: 22

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      # The tests that start Postgres, MinIO or a Collector in Docker fail instead of skipping.
      PTC_REQUIRE_DOCKER: 1
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # ptc-server's build script builds the dashboard with pnpm.
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml
      - uses: Swatinem/rust-cache@v2
      - name: Pull the images of the tests' Docker services
        run: |
          for image in postgres:17 cgr.dev/chainguard/minio:latest \
              cgr.dev/chainguard/minio-client:latest otel/opentelemetry-collector:0.165.0; do
            docker pull --quiet "$image" &
          done
          wait
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: The OpenAPI document is current, and the API's contract
        run: cargo test -p ptc-api --locked
      - name: The e2e corpus
        run: cargo test -p ptc-e2e --locked
      - name: Every other test
        run: cargo test --workspace --locked --exclude ptc-api --exclude ptc-e2e
      - name: Documentation
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  sdk:
    name: TypeScript SDK
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: sdk/typescript/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Format, types, tests
        run: pnpm check
      - name: The types generated from api/openapi.json are current
        run: pnpm check:api
      - run: pnpm build

  dashboard:
    name: Dashboard
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Lint and format
        run: pnpm check
      - run: pnpm typecheck
      - run: pnpm test
      - name: The types generated from api/openapi.json are current
        run: pnpm generate:api && git diff --exit-code -- src/generated/api.ts
      - run: pnpm build

  image:
    name: Image
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # The Dockerfile's cache mounts (cargo registry, release target, pnpm store) are kept
      # between runs in the Actions cache, and its layers in the BuildKit cache.
      - uses: actions/cache@v4
        id: mounts
        with:
          path: |
            cargo-registry
            cargo-target
            pnpm-store
          key: image-mounts-${{ hashFiles('Cargo.lock', 'dashboard/pnpm-lock.yaml') }}
          restore-keys: image-mounts-
      - uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          cache-map: |
            {
              "cargo-registry": { "target": "/usr/local/cargo/registry", "id": "ptc-cargo-registry" },
              "cargo-target": { "target": "/src/target", "id": "ptc-target-release" },
              "pnpm-store": { "target": "/pnpm/store", "id": "ptc-pnpm-store" }
            }
          skip-extraction: ${{ steps.mounts.outputs.cache-hit }}
      - name: The server image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ptc
          tags: ai-ptc:local
          load: true
          cache-from: type=gha,scope=ptc
          cache-to: type=gha,mode=max,scope=ptc
      - name: The load generator's image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: load
          tags: ai-ptc-load:local
          load: true
          cache-from: type=gha,scope=load
          cache-to: type=gha,mode=max,scope=load
      - name: Smoke test
        run: |
          docker run --rm ai-ptc:local --version
          docker run --rm ai-ptc:local server --version
          docker image ls ai-ptc
      - run: docker save ai-ptc:local ai-ptc-load:local | gzip > images.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: images
          path: images.tar.gz
          retention-days: 3

  deployment:
    name: Reference deployment (${{ matrix.runtime }})
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        runtime: [runc, gvisor]
    env:
      COMPOSE_PROFILES: ${{ matrix.runtime }}
    defaults:
      run:
        working-directory: deploy
    steps:
      - uses: actions/checkout@v4
      - name: Install gVisor
        if: matrix.runtime == 'gvisor'
        working-directory: .
        run: |
          curl -fsSL https://gvisor.dev/archive.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/gvisor-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/gvisor-archive-keyring.gpg] https://storage.googleapis.com/gvisor/releases release main" \
            | sudo tee /etc/apt/sources.list.d/gvisor.list
          sudo apt-get update && sudo apt-get install -y runsc
          sudo runsc install
          sudo systemctl restart docker
          docker info --format '{{json .Runtimes}}'
      - uses: actions/download-artifact@v4
        with:
          name: images
          path: deploy
      - run: gunzip -c images.tar.gz | docker load
      - name: Start
        run: |
          ./init.sh
          docker compose up -d
          . ./.env
          for _ in $(seq 60); do
            curl -fsS -H "Authorization: Bearer $PTC_ADMIN_KEY" http://127.0.0.1:8080/v1/server && break
            sleep 2
          done
          docker compose ps
      - name: The workers' walls
        run: ./check-walls.sh worker-1-net && ./check-walls.sh worker-2-net
      - name: Load
        run: docker compose --profile load run --rm --use-aliases loadgen run --runs 300 --concurrency 60 --timeout 10m
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: sdk/typescript/pnpm-lock.yaml
      - name: The agent tools' bound against the deployment
        run: |
          . ./.env
          key=$(curl -fsS http://127.0.0.1:8080/v1/api-keys -H "Authorization: Bearer $PTC_ADMIN_KEY" \
            -H 'content-type: application/json' -d '{"tenant": "sdk", "role": "harness"}' | jq -r .key)
          cd ../sdk/typescript
          pnpm install --frozen-lockfile
          PTC_LIVE_URL=http://127.0.0.1:8080 PTC_LIVE_KEY="$key" pnpm vitest run test/live.test.ts
      - name: Logs
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Stop
        if: always()
        run: docker compose --profile runc --profile gvisor --profile load down -v
