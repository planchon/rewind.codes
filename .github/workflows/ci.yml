# CI of Rewind: the Rust workspace (formatting, lints, every test with the Docker services the
# tests start: Postgres, MinIO, the OpenTelemetry Collector; the e2e corpus; the OpenAPI
# document), the SDK and the dashboard, the documentation and the examples, the image, and the
# reference deployment under load. On main, it deploys the sites on Vercel: app.rewind.codes once
# the dashboard's checks pass, and rewind.codes (deploy/railway/README.md, "Vercel").
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Backtraces keep their lines; the target directory stays small enough for the runner.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  RUST_BACKTRACE: 1
  PNPM_VERSION: 10.15.0
  NODE_VERSION: 22
  VERCEL_CLI_VERSION: 48.0.1
  # The team planchons-projects on Vercel; each deploy job names its project.
  VERCEL_ORG_ID: team_3kvbr5Odt6ZC3rG8nlbHVIGE

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      # The tests that start Postgres, MinIO or a Collector in Docker fail instead of skipping.
      REWIND_REQUIRE_DOCKER: 1
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # rewind-server's build script builds the dashboard with pnpm.
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml
      - uses: Swatinem/rust-cache@v2
      - name: Pull the images of the tests' Docker services
        run: |
          for image in postgres:17 cgr.dev/chainguard/minio:latest \
              cgr.dev/chainguard/minio-client:latest otel/opentelemetry-collector:0.165.0; do
            docker pull --quiet "$image" &
          done
          wait
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: The OpenAPI document is current, and the API's contract
        run: cargo test -p rewind-api --locked
      - name: The e2e corpus
        run: cargo test -p rewind-e2e --locked
      - name: Every other test
        run: cargo test --workspace --locked --exclude rewind-api --exclude rewind-e2e
      - name: Documentation
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  sdk:
    name: TypeScript SDK
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: sdk/typescript/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Format, types, tests
        run: pnpm check
      - name: The types generated from api/openapi.json are current
        run: pnpm check:api
      - run: pnpm build

  dashboard:
    name: Dashboard
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Lint and format
        run: pnpm check
      - run: pnpm typecheck
      - run: pnpm test
      - name: The types generated from api/openapi.json are current
        run: pnpm generate:api && git diff --exit-code -- src/generated/api.ts
      - run: pnpm build

  docs:
    name: Documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: The site builds, and every link resolves
        run: pnpm check

  examples:
    name: Examples
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: examples
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: examples/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: The harness code type-checks against the published SDK
        run: pnpm typecheck

  image:
    name: Image
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      # The release target and the exported images do not fit in a runner's default free space.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: docker/setup-buildx-action@v3
      # The Dockerfile's cache mounts of the cargo registry and the pnpm store are kept between
      # runs in the Actions cache, and its layers in the BuildKit cache. The release target is
      # not: several GB, it filled the runner's disk when the cache was extracted after the build.
      - uses: actions/cache@v4
        id: mounts
        with:
          path: |
            cargo-registry
            pnpm-store
          key: image-mounts-v2-${{ hashFiles('Cargo.lock', 'dashboard/pnpm-lock.yaml') }}
          restore-keys: image-mounts-v2-
      - uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          cache-map: |
            {
              "cargo-registry": { "target": "/usr/local/cargo/registry", "id": "rewind-cargo-registry" },
              "pnpm-store": { "target": "/pnpm/store", "id": "rewind-pnpm-store" }
            }
          skip-extraction: ${{ steps.mounts.outputs.cache-hit }}
      - name: The server image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: rewind
          tags: rewind:local
          load: true
          cache-from: type=gha,scope=rewind
          cache-to: type=gha,mode=max,scope=rewind
      - name: The load generator's image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: load
          tags: rewind-load:local
          load: true
          cache-from: type=gha,scope=load
          cache-to: type=gha,mode=max,scope=load
      - name: Smoke test
        run: |
          docker run --rm rewind:local --version
          docker run --rm rewind:local server --version
          docker image ls rewind
      - run: docker save rewind:local rewind-load:local | gzip > images.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: images
          path: images.tar.gz
          retention-days: 3

  deployment:
    name: Reference deployment (${{ matrix.runtime }})
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        runtime: [runc, gvisor]
    env:
      COMPOSE_PROFILES: ${{ matrix.runtime }}
    defaults:
      run:
        working-directory: deploy
    steps:
      - uses: actions/checkout@v4
      - name: Install gVisor
        if: matrix.runtime == 'gvisor'
        working-directory: .
        run: |
          curl -fsSL https://gvisor.dev/archive.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/gvisor-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/gvisor-archive-keyring.gpg] https://storage.googleapis.com/gvisor/releases release main" \
            | sudo tee /etc/apt/sources.list.d/gvisor.list
          sudo apt-get update && sudo apt-get install -y runsc
          sudo runsc install
          sudo systemctl restart docker
          docker info --format '{{json .Runtimes}}'
      - uses: actions/download-artifact@v4
        with:
          name: images
          path: deploy
      - run: gunzip -c images.tar.gz | docker load
      - name: Start
        run: |
          ./init.sh
          docker compose up -d
          . ./.env
          for _ in $(seq 60); do
            curl -fsS -H "Authorization: Bearer $REWIND_ADMIN_KEY" http://127.0.0.1:8080/v1/server && break
            sleep 2
          done
          docker compose ps
      # Under gVisor, from a sandbox with the workers' network settings (check-walls.sh).
      - name: The workers' walls
        run: ./check-walls.sh worker-1-net && ./check-walls.sh worker-2-net
      - name: Load
        run: docker compose --profile load run --rm --use-aliases loadgen run --runs 300 --concurrency 60 --timeout 10m
      # Payloads above 64 KiB go to S3: the workers reach MinIO.
      - name: Load with payloads in S3
        run: docker compose --profile load run --rm --use-aliases loadgen run --runs 60 --concurrency 20 --payload-bytes 102400 --timeout 10m
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: sdk/typescript/pnpm-lock.yaml
      - name: The agent tools' bound against the deployment
        run: |
          . ./.env
          key=$(curl -fsS http://127.0.0.1:8080/v1/api-keys -H "Authorization: Bearer $REWIND_ADMIN_KEY" \
            -H 'content-type: application/json' -d '{"tenant": "sdk", "role": "harness", "name": "sdk live test"}' | jq -r .key)
          cd ../sdk/typescript
          pnpm install --frozen-lockfile
          REWIND_LIVE_URL=http://127.0.0.1:8080 REWIND_LIVE_KEY="$key" pnpm vitest run test/live.test.ts
      - name: Logs
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Stop
        if: always()
        run: docker compose --profile runc --profile gvisor --profile walls --profile load down -v

  # The sites, from main only. Vercel builds each from its directory, as its vercel.json says;
  # VERCEL_TOKEN is a token of the team planchons-projects, a secret of the repository.
  deploy-dashboard:
    name: Deploy app.rewind.codes
    needs: dashboard
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: app.rewind.codes
      url: https://app.rewind.codes
    # One deploy at a time, the later after the earlier: production ends on the latest commit.
    concurrency:
      group: deploy-dashboard
      cancel-in-progress: false
    env:
      VERCEL_PROJECT_ID: prj_52eqdFVey1BaBF4y8PyTrLhgiscg
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Deploy to production
        run: npx --yes "vercel@$VERCEL_CLI_VERSION" deploy --prod --yes --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

  deploy-landing:
    name: Deploy rewind.codes
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: rewind.codes
      url: https://rewind.codes
    concurrency:
      group: deploy-landing
      cancel-in-progress: false
    env:
      VERCEL_PROJECT_ID: prj_0QXPir4Pe2XOuH3eRRiUypnsTcyA
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Deploy to production
        run: npx --yes "vercel@$VERCEL_CLI_VERSION" deploy --prod --yes --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
