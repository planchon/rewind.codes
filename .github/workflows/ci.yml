# CI of Rewind: what is built with pnpm (the SDK, the dashboard, the documentation, the
# examples), and, on main, the sites deployed on Vercel: app.rewind.codes once the dashboard's
# checks pass, and rewind.codes (deploy/railway/README.md, "Vercel"). The Rust workspace and the
# image are checked on the developer's machine before a commit, and the server deployed by hand
# (CLAUDE.md, .claude/skills/deploy; archi/08-decisions.md, "Taken for the development loop").
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PNPM_VERSION: 10.15.0
  NODE_VERSION: 22
  VERCEL_CLI_VERSION: 48.0.1
  # The team planchons-projects on Vercel; each deploy job names its project.
  VERCEL_ORG_ID: team_3kvbr5Odt6ZC3rG8nlbHVIGE

jobs:
  sdk:
    name: TypeScript SDK
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: sdk/typescript/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Format, types, tests
        run: pnpm check
      - name: The types generated from api/openapi.json are current
        run: pnpm check:api
      - run: pnpm build

  dashboard:
    name: Dashboard
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Lint and format
        run: pnpm check
      - run: pnpm typecheck
      - run: pnpm test
      - name: The types generated from api/openapi.json are current
        run: pnpm generate:api && git diff --exit-code -- src/generated/api.ts
      - run: pnpm build

  docs:
    name: Documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: The site builds, and every link resolves
        run: pnpm check

  examples:
    name: Examples
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: examples
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: examples/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: The harness code type-checks against the published SDK
        run: pnpm typecheck

  # The sites, from main only. Vercel builds each from its directory, as its vercel.json says;
  # VERCEL_TOKEN is a token of the team planchons-projects, a secret of the repository.
  deploy-dashboard:
    name: Deploy app.rewind.codes
    needs: dashboard
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: app.rewind.codes
      url: https://app.rewind.codes
    # One deploy at a time, the later after the earlier: production ends on the latest commit.
    concurrency:
      group: deploy-dashboard
      cancel-in-progress: false
    env:
      VERCEL_PROJECT_ID: prj_52eqdFVey1BaBF4y8PyTrLhgiscg
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Deploy to production
        run: npx --yes "vercel@$VERCEL_CLI_VERSION" deploy --prod --yes --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

  deploy-landing:
    name: Deploy rewind.codes
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: rewind.codes
      url: https://rewind.codes
    concurrency:
      group: deploy-landing
      cancel-in-progress: false
    env:
      VERCEL_PROJECT_ID: prj_0QXPir4Pe2XOuH3eRRiUypnsTcyA
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Deploy to production
        run: npx --yes "vercel@$VERCEL_CLI_VERSION" deploy --prod --yes --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
