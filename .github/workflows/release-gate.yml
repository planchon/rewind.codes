# The release gate (acceptance/release/README.md), started by hand before a release: every stage
# but the load test, which runs locally. The verdict and the failed checks are on the run's page;
# the report and the servers' logs are its artifact.
name: Release gate

on:
  workflow_dispatch:
    inputs:
      ref:
        description: The commit, branch or tag to test
        required: false
        default: main

permissions:
  contents: read

concurrency:
  group: release-gate-${{ inputs.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  PNPM_VERSION: 10.15.0
  NODE_VERSION: 22

jobs:
  gate:
    name: Release gate
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: |
            dashboard/pnpm-lock.yaml
            sdk/typescript/pnpm-lock.yaml
            acceptance/pnpm-lock.yaml
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-gate
      - name: Pull the images of the setups
        run: |
          for image in postgres:17 cgr.dev/chainguard/minio:latest \
              cgr.dev/chainguard/minio-client:latest otel/opentelemetry-collector:0.165.0; do
            docker pull --quiet "$image" &
          done
          wait
      - name: The gate
        run: acceptance/release.sh --skip-load
      - name: Summary
        if: always()
        run: |
          if [ -f acceptance/results/release/report.md ]; then
            cat acceptance/results/release/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The gate wrote no report: see the step's log." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-gate-report
          path: |
            acceptance/results/release/
            !acceptance/results/release/artifacts/
          retention-days: 30
