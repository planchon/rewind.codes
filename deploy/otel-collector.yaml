# The OpenTelemetry Collector of the reference deployment: OTLP in, over gRPC and HTTP, from
# the nodes (service telemetry, and run telemetry projected from the journal).
# Replace the `debug` exporter by your backend's (otlp, otlphttp…).
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
