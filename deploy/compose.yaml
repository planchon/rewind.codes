# The reference deployment of Rewind (deploy/README.md): Postgres for the control plane, MinIO
# (S3) for the bucket of the partitions, the archive and the blobs, an OpenTelemetry Collector,
# two nodes behind an edge, and the nodes' egress gateway.
#
#   ./init.sh                                   # writes .env with fresh secrets, once
#   docker compose up -d --build                # nodes under runc
#   docker compose --profile gvisor up -d       # nodes under gVisor (needs runsc)
#   ./check-walls.sh                            # the nodes' walls hold
#
# Networks:
#   public  the edge, services outside the deployment
#   core    internal, no route out: the stores, the collector, the nodes, the egress
#
# Every node is an HTTP edge and a node of the run plane, and runs code written by a model: it
# holds no network of its own, but joins the namespace of a holder (`node-N-net`) whose default
# route goes through the egress gateway, its only way out. A node restarts when its holder is
# recreated (`restart: true`): a node left in the namespace of a removed holder has no network.
# Under gVisor, a node's sandbox takes over that namespace, and its DNS server is the relay
# `node-dns` (README, "Nodes: the walls"). The nodes reach each other's link on the core network.

name: Rewind

x-rewind: &rewind
  image: ${REWIND_IMAGE:-rewind:local}
  restart: unless-stopped
  # A stopping node hands its partitions over and lets the requests in flight end, for up to 30 s.
  stop_grace_period: 40s
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs:
    - /tmp:size=64m
    # tsgo, extracted at the first type-check: it must be executable.
    - /var/cache/rewind:size=256m,exec,uid=65532,gid=65532,mode=0700

x-node: &node
  <<: *rewind
  command: [server]
  mem_limit: ${REWIND_NODE_MEMORY:-1g}
  cpus: ${REWIND_NODE_CPUS:-2}
  depends_on: &node-depends
    postgres: { condition: service_healthy }
    minio-init: { condition: service_completed_successfully }
    otel-collector: { condition: service_started }

# What every node of the deployment is given, the executors of a previous build included.
x-node-env: &node-env
  REWIND_STORE: postgres://rewind:${POSTGRES_PASSWORD:?run ./init.sh first}@postgres:5432/rewind
  REWIND_BUCKET: s3://rewind-payloads
  REWIND_S3_ENDPOINT: http://minio:9000
  REWIND_S3_REGION: us-east-1
  REWIND_S3_ALLOW_HTTP: "true"
  REWIND_S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?run ./init.sh first}
  REWIND_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?run ./init.sh first}
  REWIND_MASTER_KEY: ${REWIND_MASTER_KEY:?run ./init.sh first}
  REWIND_CLUSTER_SECRET: ${REWIND_CLUSTER_SECRET:?run ./init.sh first}
  REWIND_PUBLIC_URL: ${REWIND_PUBLIC_URL:-http://localhost:8080}
  REWIND_OTLP_ENDPOINT: http://otel-collector:4318
  REWIND_LOG: ${REWIND_LOG:-info}
  REWIND_DEFAULT_TTL: ${REWIND_DEFAULT_TTL:-30d}
  REWIND_MAX_TTL: ${REWIND_MAX_TTL:-365d}
  REWIND_EXECUTORS: ${REWIND_EXECUTORS:-4}
  REWIND_CALLS: ${REWIND_CALLS:-256}
  REWIND_CACHE_INSTANCES: ${REWIND_CACHE_INSTANCES:-500}
  REWIND_CACHE_MEMORY: ${REWIND_CACHE_MEMORY:-384MiB}
  # MCP servers at private addresses the nodes may reach (names, *.domain, CIDR networks):
  # `loadgen` is the load generator's fake MCP server (profile load).
  REWIND_ALLOW_INTERNAL_ADDRESSES: ${REWIND_ALLOW_INTERNAL_ADDRESSES:-loadgen}

# What the nodes that serve the HTTP API are given besides: the first key, and what the tenants
# they create get.
x-edge-env: &edge-env
  <<: *node-env
  REWIND_ADMIN_KEY: ${REWIND_ADMIN_KEY:?run ./init.sh first}
  REWIND_ADMIN_TENANT: ${REWIND_ADMIN_TENANT:-default}
  REWIND_QUOTA_ACTIVE_RUNS: ${REWIND_QUOTA_ACTIVE_RUNS:-10000}
  REWIND_RETENTION: ${REWIND_RETENTION:-365d}

x-holder: &holder
  build: ./egress
  image: rewind-egress:local
  entrypoint: [/usr/local/bin/route.sh]
  restart: unless-stopped
  cap_drop: [ALL]
  cap_add: [NET_ADMIN]
  environment:
    REWIND_EGRESS_ADDRESS: ${REWIND_EGRESS_ADDRESS:-172.29.213.2}
  dns: ["${REWIND_EGRESS_ADDRESS:-172.29.213.2}"]
  networks: [core]
  tmpfs:
    - /run:size=64k
  mem_limit: 16m
  # Healthy once its route is set (route.sh).
  healthcheck:
    test: [CMD, test, -e, /run/routed]
    interval: 1m
    start_period: 1m
    start_interval: 1s
  depends_on: [egress]

# A node under gVisor. Its sandbox runs its own network stack, which copies the addresses and
# routes of the holder's namespace when it starts and takes them from the namespace: it starts
# once the holder has set its route. That stack cannot reach Docker's DNS server (127.0.0.11),
# so its DNS server is the relay `node-dns`, which answers what Docker's answers a node under
# runc.
x-gvisor: &gvisor
  runtime: runsc
  volumes: [./egress/resolv.conf:/etc/resolv.conf:ro]

x-gvisor-depends: &gvisor-depends
  <<: *node-depends
  node-dns: { condition: service_started }

networks:
  public: {}
  core:
    internal: true
    ipam:
      config:
        # Fixed addresses below .128 (the egress gateway is .2); Docker hands out the rest.
        - subnet: ${REWIND_CORE_SUBNET:-172.29.213.0/24}
          ip_range: ${REWIND_CORE_RANGE:-172.29.213.128/25}

volumes:
  postgres: {}
  minio: {}

services:
  # The control plane, and the nodes' liveness locks in the database `postgres` of the same
  # server, where nothing else is stored.
  postgres:
    image: postgres:17
    restart: unless-stopped
    command: [postgres, -c, max_connections=200]
    environment:
      POSTGRES_USER: rewind
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run ./init.sh first}
      POSTGRES_DB: rewind
    volumes: [postgres:/var/lib/postgresql/data]
    networks: [core]
    mem_limit: 512m
    shm_size: 128m
    healthcheck:
      test: [CMD, pg_isready, -U, rewind, -d, rewind]
      interval: 2s
      timeout: 5s
      retries: 30

  minio:
    image: cgr.dev/chainguard/minio:latest
    restart: unless-stopped
    command: [server, /data, --address, ":9000"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?run ./init.sh first}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?run ./init.sh first}
      MC_HOST_local: http://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@127.0.0.1:9000
    volumes: [minio:/data]
    networks: [core]
    mem_limit: 512m
    healthcheck:
      test: [CMD, mc, ready, local]
      interval: 2s
      timeout: 5s
      retries: 30

  # The bucket: the partitions, the archive of ended runs and the blobs.
  minio-init:
    image: cgr.dev/chainguard/minio-client:latest
    command: [mb, --ignore-existing, rewind/rewind-payloads]
    environment:
      MC_HOST_rewind: http://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@minio:9000
    networks: [core]
    depends_on:
      minio: { condition: service_healthy }

  otel-collector:
    image: otel/opentelemetry-collector:0.165.0
    restart: unless-stopped
    command: [--config, /etc/otelcol/config.yaml]
    volumes: [./otel-collector.yaml:/etc/otelcol/config.yaml:ro]
    networks: [core]
    mem_limit: 256m

  # The nodes' only way out: forwards to the addresses of REWIND_EGRESS_ALLOW's names only.
  egress:
    build: ./egress
    image: rewind-egress:local
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, NET_RAW, NET_BIND_SERVICE, SETUID, SETGID]
    sysctls:
      net.ipv4.ip_forward: "1"
    environment:
      REWIND_EGRESS_ADDRESS: ${REWIND_EGRESS_ADDRESS:-172.29.213.2}
      # MCP servers, APIs and their OpenAPI documents, hosts of `http` tools, receivers of
      # webhook subscriptions. `loadgen` is the fake MCP server of the load generator (profile
      # load).
      REWIND_EGRESS_ALLOW: ${REWIND_EGRESS_ALLOW:-loadgen}
      REWIND_EGRESS_LOG_QUERIES: ${REWIND_EGRESS_LOG_QUERIES:-}
    networks:
      core: { ipv4_address: "${REWIND_EGRESS_ADDRESS:-172.29.213.2}" }
      public: {}
    mem_limit: 64m

  # The DNS server of the nodes under gVisor (egress/dns.sh, egress/resolv.conf).
  node-dns:
    build: ./egress
    image: rewind-egress:local
    entrypoint: [/usr/local/bin/dns.sh]
    profiles: [gvisor, previous-epoch-gvisor, walls]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE, SETUID, SETGID]
    environment:
      REWIND_NODE_DNS_ADDRESS: ${REWIND_NODE_DNS_ADDRESS:-172.29.213.3}
    dns: ["${REWIND_EGRESS_ADDRESS:-172.29.213.2}"]
    networks:
      core: { ipv4_address: "${REWIND_NODE_DNS_ADDRESS:-172.29.213.3}" }
    mem_limit: 32m
    depends_on: [egress]

  # The only published port: each request goes to a node (edge/Caddyfile).
  edge:
    image: caddy:2-alpine
    restart: unless-stopped
    volumes: [./edge/Caddyfile:/etc/caddy/Caddyfile:ro]
    ports:
      - ${REWIND_BIND:-127.0.0.1}:${REWIND_PORT:-8080}:8080
    networks: [public, core]
    mem_limit: 128m
    depends_on: [node-1-net, node-2-net]

  # The network namespaces of the nodes.
  node-1-net: *holder
  node-2-net: *holder

  node-1:
    <<: *node
    build:
      context: ..
      target: rewind
    profiles: [runc]
    network_mode: service:node-1-net
    environment:
      <<: *edge-env
      REWIND_NODE_ID: node-1
      REWIND_LINK_ADDRESS: node-1-net:7070
    depends_on:
      <<: *node-depends
      node-1-net: { condition: service_started, restart: true }

  node-2:
    <<: *node
    profiles: [runc]
    network_mode: service:node-2-net
    environment:
      <<: *edge-env
      REWIND_NODE_ID: node-2
      REWIND_LINK_ADDRESS: node-2-net:7070
    depends_on:
      <<: *node-depends
      node-2-net: { condition: service_started, restart: true }

  # The same nodes under gVisor: `docker compose --profile gvisor up -d` on a host whose
  # Docker has the runsc runtime (https://gvisor.dev/docs/user_guide/install/).
  node-1-gvisor:
    <<: [*node, *gvisor]
    build:
      context: ..
      target: rewind
    profiles: [gvisor]
    network_mode: service:node-1-net
    environment:
      <<: *edge-env
      REWIND_NODE_ID: node-1
      REWIND_LINK_ADDRESS: node-1-net:7070
    depends_on:
      <<: *gvisor-depends
      node-1-net: { condition: service_healthy, restart: true }

  node-2-gvisor:
    <<: [*node, *gvisor]
    profiles: [gvisor]
    network_mode: service:node-2-net
    environment:
      <<: *edge-env
      REWIND_NODE_ID: node-2
      REWIND_LINK_ADDRESS: node-2-net:7070
    depends_on:
      <<: *gvisor-depends
      node-2-net: { condition: service_healthy, restart: true }

  # The executors of the previous build, kept after an upgrade that changed the determinism
  # epoch until the runs of its epochs end (README, "Upgrades"): `--executors-only`, they own no
  # partition and serve no HTTP route, and the owners send them the activations of those runs
  # over the node link. `previous-epoch` runs it under runc, `previous-epoch-gvisor` under gVisor.
  node-previous-net:
    <<: *holder
    profiles: [previous-epoch, previous-epoch-gvisor]

  node-previous:
    <<: *node
    image: ${REWIND_PREVIOUS_IMAGE:-rewind:local}
    command: [server, --executors-only]
    profiles: [previous-epoch]
    network_mode: service:node-previous-net
    environment:
      <<: *node-env
      REWIND_NODE_ID: node-previous
      REWIND_LINK_ADDRESS: node-previous-net:7070
    depends_on:
      <<: *node-depends
      node-previous-net: { condition: service_started, restart: true }

  node-previous-gvisor:
    <<: [*node, *gvisor]
    image: ${REWIND_PREVIOUS_IMAGE:-rewind:local}
    command: [server, --executors-only]
    profiles: [previous-epoch-gvisor]
    network_mode: service:node-previous-net
    environment:
      <<: *node-env
      REWIND_NODE_ID: node-previous
      REWIND_LINK_ADDRESS: node-previous-net:7070
    depends_on:
      <<: *gvisor-depends
      node-previous-net: { condition: service_healthy, restart: true }

  # The walls of the nodes under gVisor, checked by check-walls.sh, which starts and removes
  # these two. A node's sandbox takes over its namespace, where nothing else can run: the
  # walls are checked from a sandbox of their own, with the same network settings (`x-gvisor`)
  # in the namespace of a holder like theirs.
  walls-net:
    <<: *holder
    profiles: [walls]

  walls:
    <<: *gvisor
    image: rewind-egress:local
    profiles: [walls]
    entrypoint: [sleep, "2147483647"]
    stop_signal: SIGKILL
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    network_mode: service:walls-net
    depends_on:
      walls-net: { condition: service_healthy }
      node-dns: { condition: service_started }

  # The load generator (`rewind-load`), with its fake MCP server at http://loadgen:9100/mcp, which
  # the nodes reach through the egress gateway: `docker compose --profile load run --rm
  # --no-deps --use-aliases loadgen run …` (README, "Load and limit tests").
  loadgen:
    build:
      context: ..
      target: load
    image: ${REWIND_LOAD_IMAGE:-rewind-load:local}
    profiles: [load]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      REWIND_URL: http://edge:8080
      REWIND_ADMIN_KEY: ${REWIND_ADMIN_KEY:?run ./init.sh first}
      REWIND_LOAD_MCP_LISTEN: 0.0.0.0:9100
      REWIND_LOAD_MCP_URL: http://loadgen:9100/mcp
    networks: [public]
    mem_limit: 512m
    depends_on: [edge]
