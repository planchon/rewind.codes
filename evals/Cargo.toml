[package]
name = "evals"
description = "Eval suite of Rewind: models solve tasks end to end with the agent tools, on the real engine, against deterministic fake MCP servers, in virtual time."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
# Every file of tests/ is a module of one test binary, tests/integration.rs.
autotests = false

# Tooling (archi/07-code-architecture.md, "Dependency rules"): wires the adapters like a
# composition root, and nothing depends on it.
[dependencies]
rewind-agent-tools.workspace = true
rewind-api.workspace = true
rewind-check.workspace = true
rewind-codegen.workspace = true
rewind-core.workspace = true
rewind-engine.workspace = true
rewind-format.workspace = true
rewind-mcp.workspace = true
rewind-outbound.workspace = true
rewind-runtime.workspace = true
axum.workspace = true
clap.workspace = true
reqwest.workspace = true
rmcp = { workspace = true, features = ["server", "transport-streamable-http-server"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tokio-util.workspace = true

[dev-dependencies]
tempfile.workspace = true

[[test]]
name = "integration"
path = "tests/integration.rs"

[lints]
workspace = true
